metrics:
  roe: {column: return_on_equity_pct, min: 0}
  roce: {column: return_on_capital_employed_pct, min: 0}
  net_profit_margin: {column: net_profit_margin_pct, min: 0}
  debt_to_equity: {column: debt_to_equity, max: 2}
  pe_ratio: {column: pe_ratio, max: 100}
  pb_ratio: {column: pb_ratio, max: 100}
  dividend_yield: {column: dividend_yield_pct, min: 0}
  dividend_payout: {column: dividend_payout_ratio_pct, max: 100}
  free_cash_flow: {column: free_cash_flow_cr, min: 0}
  revenue: {column: revenue_cr, min: 0}
  revenue_cagr_3yr: {column: revenue_cagr_3yr, min: 0}
  revenue_cagr_5yr: {column: revenue_cagr_5yr, min: 0}
  pat_cagr_5yr: {column: pat_cagr_5yr, min: 0}
  eps_cagr_5yr: {column: eps_cagr_5yr, min: 0}
  interest_coverage: {column: interest_coverage, min: 0}

presets:
  Quality Compounder:
    roe: {min: 15}
    debt_to_equity: {max: 1}
    free_cash_flow: {min: 0}
    revenue_cagr_5yr: {min: 10}
  Value Pick:
    pe_ratio: {max: 20}
    pb_ratio: {max: 3}
    debt_to_equity: {max: 2}
    dividend_yield: {min: 1}
  Growth Accelerator:
    pat_cagr_5yr: {min: 20}
    revenue_cagr_5yr: {min: 15}
    debt_to_equity: {max: 2}
  Dividend Champion:
    dividend_yield: {min: 2}
    dividend_payout: {max: 80}
    free_cash_flow: {min: 0}
  Debt-Free Blue Chip:
    debt_to_equity: {eq: 0}
    roe: {min: 12}
    revenue: {min: 5000}
  Turnaround Watch:
    revenue_cagr_3yr: {min: 10}
    free_cash_flow: {min: 0}
    debt_to_equity: {declining_yoy: true}